# Advanced, technical tuning. Jurus (gesture -> sound -> visual), devices and language are set in the
# app and kept in %APPDATA%\MeetCam (see README). Keys marked "overridden in Settings" are replaced there.

camera:
  device_id: 0         # overridden in Settings (Camera)
  width: 1280
  height: 720
  fps: 30

virtual_camera:
  enabled: true          # overridden in Settings (Send to the virtual camera)
  backend: obs           # "OBS Virtual Camera" driver, installed with OBS Studio (OBS itself need not run)

tracking:
  model_path: models/hand_landmarker.task
  detection_confidence: 0.6
  tracking_confidence: 0.5
  smoothing: 0.35        # EMA alpha: 1.0 = raw (jittery), lower = smoother but laggier
  max_hands: 2           # 2 for the two-hand jurus (seal, wow); the orb and one-hand jurus follow one hand

gesture:
  # openness = mean fingertip→palm-center distance / palm size (wrist→middle MCP)
  # measured on this setup: fist ≈ 0.32, open palm ≈ 1.10
  fist_below: 0.55       # openness below this (with no finger raised) → FIST
  debounce_frames: 3     # consecutive frames needed before a gesture change is accepted
  lost_frames: 5         # frames without a hand before reporting NO_HAND
  two_hand_grace: 0.6    # seconds after two hands were seen during which a lone hand counts as half of a
                         # two-hand pose (crossed hands often hide one from the tracker): one-hand jurus
                         # don't fire
  # finger counting (3D, rotation-free). Measured: raised fingers ≥ 0.94, folded ≤ 0.71
  finger_straight: 0.82  # a finger counts as raised above this straightness (knuckle→tip / finger length)
  raise_above: 0.6       # a fist with the wrist in the top 60% of the frame (0 = top edge) is a RAISED_FIST
  # thumb tip sideways past the index knuckle, in palm lengths. Measured: out +0.3…+0.56, folded −0.2…−0.4
  thumb_out: 0.1         # above → thumb out (3+ fingers = OPEN_PALM); below → folded (4 fingers = FOUR)

orb:
  # style and video are overridden by the orb jurus: its video file (black background, orb centered; intro,
  # loop and size are auto-detected) is screen-blended, and with no file, or one that can't be read, the
  # orb is drawn in code. Everything else below is the orb's look and feel.
  style: procedural      # video = a clip, screen-blended; procedural = drawn in code
  video: null
  video_scale: 1.0       # size tweak for the video orb
  color_bgr: [255, 115, 20]   # procedural orb / blast: electric blue body; streaks and core glow toward white
  radius: 0.6            # sphere radius in palm lengths (wrist→middle MCP)
  palm_position: 0.5     # 0 = wrist, 1 = knuckle line; 0.5 = middle of the palm
  hover: 1.0             # orb center distance from the palm along its normal, in orb radii (1 = touching)
  center_lock: 0.75      # |palm-normal z| above which the orb snaps to the palm middle (palm ~facing camera)
  world_smoothing: 0.3   # EMA alpha for 3D landmarks used for the palm direction (depth is noisier than x/y)
  occlusion_start: 0.65  # palm-normal z where the hand starts covering the orb (back of hand to camera)
  occlusion_full: 0.9    # palm-normal z where the hand fully covers it
  opacity: 0.8           # how much the sphere body covers the hand behind it
  glow: 1.0
  particles: 40
  spawn_time: 0.25       # seconds to fade in
  fade_time: 0.4         # seconds to fade out after the hand is lost

charge:
  # charging = holding the orb with the open palm turned away from the camera (up / sideways)
  min_time: 0.5          # hold at least this long, or aiming at the camera won't blast
  max_time: 3.0          # charge level saturates here
  max_scale: 2.0         # orb size at full charge

blast:
  # facing = how squarely the palm faces the camera: +1 straight at it, 0 edge-on, negative turned away.
  # Measured: palm to camera ≈ +0.92, palm up (holding) ≈ −0.64
  aim: 0.7               # facing above this throws the orb (blast if charged long enough)
  hold_below: 0.5        # facing below this counts as holding (charging); the gap stops flicker mid-turn
  duration: 0.6
  cooldown: 1.0          # seconds after a blast before a new orb can spawn

vanish_defaults:
  # used by the vanish visual of a jurus (the smoke clip is set per jurus; the empty-room photo is
  # %APPDATA%\MeetCam\background.png, taken with the Room photo button / B)
  capture_delay: 5       # seconds to leave the frame after pressing Room photo (B)
  smoke_height: 1.8      # smoke size relative to the frame height (its densest puff lands on the seal)

audio:
  enabled: true
  host_api: Windows WASAPI   # low latency; "MME" is the slow but always-works fallback
  output_device: null    # overridden in Settings (Speaker)
  sample_rate: 48000
  blocksize: 256         # samples per audio callback (~5 ms)
  master_volume: 0.8
  sfx_volume: 1.0
  charge_volume: 0.6

meeting_audio:
  # Your mic + the sound effects go to VB-CABLE, so meeting participants hear the SFX.
  # In Meet/Zoom choose the microphone "CABLE Output (VB-Audio Virtual Cable)".
  # Without VB-CABLE installed the app still runs; only you hear the SFX (Meeting audio: OFF).
  # The mic and the meeting output are chosen in Settings; the two device keys below are overridden there.
  enabled: true
  mic_device: USB Audio CODEC   # overridden in Settings (Microphone). If meetings hear only hiss, check the
                                # mixer (gain, main mix, +48V) or pick the webcam mic. A default mic that is
                                # CABLE Output is refused: the app would feed its own output back in.
  output_device: CABLE Input    # overridden in Settings (Meeting output); VB-CABLE's playback side
  mic_volume: 1.0
  sfx_volume: 0.8               # SFX loudness in the meeting (next to your voice)
  max_latency_ms: 60            # mic buffer cap; older audio is dropped if the two device clocks drift
