camera:
  device_id: 0
  width: 1280
  height: 720
  fps: 30

tracking:
  model_path: models/hand_landmarker.task
  detection_confidence: 0.6
  tracking_confidence: 0.5
  smoothing: 0.35        # EMA alpha: 1.0 = raw (jittery), lower = smoother but laggier

gesture:
  # openness = mean fingertip→palm-center distance / palm size (wrist→middle MCP)
  # measured on this setup: fist ≈ 0.32, open palm ≈ 1.10
  fist_below: 0.55       # openness below this → FIST
  open_above: 0.8        # openness above this → OPEN_PALM; in between keeps previous (hysteresis)
  debounce_frames: 3     # consecutive frames needed before a gesture change is accepted
  lost_frames: 5         # frames without a hand before reporting NO_HAND

orb:
  color_bgr: [255, 115, 20]   # electric blue body; streaks, swooshes and core glow toward white
  radius: 0.6            # sphere radius in palm sizes (wrist→middle MCP)
  palm_position: 0.5     # 0 = wrist, 1 = knuckle line; 0.5 = middle of the palm
  hover: 1.0             # orb center distance from the palm along its normal, in orb radii (1 = touching)
  normal_smoothing: 0.3  # EMA alpha for the palm-facing direction (depth is noisier than x/y)
  normal_flip: false     # set true if the orb appears on the back of your hand
  occlusion_start: 0.0   # palm-normal z where the hand starts covering the orb (palm turning away)
  occlusion_full: 0.3    # palm-normal z where the hand fully covers it
  opacity: 0.8           # how much the sphere body covers the hand behind it
  glow: 1.0
  particles: 40
  spawn_time: 0.25       # seconds to fade in
  fade_time: 0.4         # seconds to fade out after the hand is lost

charge:
  min_time: 0.5          # charge shorter than this never blasts
  max_time: 3.0          # charge level saturates here
  max_scale: 2.0         # orb size at full charge

blast:
  release_window: 0.25   # max seconds from leaving the fist to fully open for a release to count
  confirm_frames: 2      # frames above open_above needed to fire (filters single-frame glitches)
  duration: 0.6
  cooldown: 1.0          # seconds after a blast before a new orb can spawn

audio:
  enabled: true
  host_api: Windows WASAPI   # low latency; "MME" is the slow but always-works fallback
  output_device: null    # null = Windows default output; or part of a device name, e.g. "USB Audio CODEC"
  sample_rate: 48000
  blocksize: 256         # samples per audio callback (~5 ms)
  master_volume: 0.8
  sfx_volume: 1.0
  charge_volume: 0.6
  # drop activation.wav / charge_loop.wav / blast.wav / power_down.wav (16-bit PCM) into
  # assets/audio/ to replace the synthesized placeholders
